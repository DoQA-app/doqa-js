name: PR labels

# Every PR must carry a type: label - release notes are grouped by them (.github/release.yml).
on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const allowed = ['type:feature', 'type:bug', 'type:docs',
                             'type:dependencies', 'type:internal', 'type:skip-changelog'];
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const typed = labels.filter(l => allowed.includes(l));
            if (typed.length === 0) {
              core.setFailed(`PR must carry one of the labels: ${allowed.join(', ')}`);
            }
